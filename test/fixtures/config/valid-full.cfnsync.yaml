version: 1
allowedAccounts: ["123456789012"]
allowedRegions: [ap-northeast-1, us-east-1]
defaultRegion: ap-northeast-1
stackNamePrefix: legacy-app-

state:
  backend: s3
  s3:
    bucket: my-cfnsync-state
    key: prod/cfnsync.state.json
    region: ap-northeast-1

stacks:
  # regions は意図的に非アルファベット順(記載順保持の検証用)
  templates/network.yaml:
    stackName: prod-network
    regions: [us-east-1, ap-northeast-1]
    parameters:
      VpcCidr: 10.0.0.0/16
      InstanceCount: 3
      EnableNat: true
      DbPassword: __REQUIRED__
    tags:
      Project: legacy-app
    capabilities: [CAPABILITY_NAMED_IAM]
    dependsOn: []
    regionOverrides:
      us-east-1:
        parameters:
          VpcCidr: 10.1.0.0/16
        tags:
          Region: us

  # stackName 省略 → stackNamePrefix + ファイル名(拡張子除去)で導出される
  templates/database.yaml:
    dependsOn: [templates/network.yaml]
